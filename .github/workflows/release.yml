# Релиз ядра (ADR-0014). На PR и main: antec-release check и сборка всех образов ядра под
# linux/amd64 и linux/arm64 без публикации. По тегу vX.Y.Z: публикация в GHCR по digest,
# индекс на две платформы, cosign keyless, SBOM (syft, SPDX) как cosign-аттестация, BuildKit
# provenance mode=max в индексе, подписанный release.json и GitHub Release.
#
# Identity подписи: https://github.com/<repo>/.github/workflows/release.yml@refs/tags/vX.Y.Z,
# issuer https://token.actions.githubusercontent.com. Переименование файла меняет identity
# (несовместимое изменение для antec-instance core-pin).
#
# Actions закреплены как в pincheck.yml; upload/download-artifact проверены 2026-11-26
# (`gh api repos/actions/<name>/git/ref/tags/<tag>`, OSV и GHSA для этих версий пусты).
name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Та же версия и checksum, что в pincheck.yml (components.uv в реестре).
  UV_VERSION: "0.13.8"
  UV_CHECKSUM: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"
  # components.buildkit в реестре.
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
  # components.cosign и components.syft в реестре: sha256 из подписанных checksums релизов.
  COSIGN_VERSION: "3.1.4"
  COSIGN_SHA256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
  SYFT_VERSION: "1.57.2"
  SYFT_SHA256: "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b"

jobs:
  check:
    name: "antec-release: тесты, версия, CHANGELOG"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - name: "tools/release: ruff, mypy, pytest"
        working-directory: tools/release
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check --output-format=github .
          uv run --locked mypy
          uv run --locked pytest
      - name: antec-release check
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TAG" ]; then args=(--tag "$TAG"); fi
          uv run --project tools/release --locked antec-release check "${args[@]}"
      # Через API, а не git: checkout может заменить аннотированный тег лёгким.
      - name: Аннотированный тег на коммите из main или release/*
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)"
          test "$type" = tag || { echo "тег $TAG не аннотированный" >&2; exit 1; }
          for branch in $(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' \
              | grep -Ex 'main|release/[0-9]+\.[0-9]+'); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$GITHUB_SHA" --jq .status)"
            if [ "$status" = identical ] || [ "$status" = behind ]; then
              echo "коммит $GITHUB_SHA в $branch"; exit 0
            fi
          done
          echo "коммит $GITHUB_SHA не в main и не в release/*" >&2
          exit 1
      - id: matrix
        name: Матрица образов
        run: echo "matrix=$(uv run --project tools/release --locked antec-release images)" >> "$GITHUB_OUTPUT"

  build:
    name: "сборка ${{ matrix.name }} ${{ matrix.platform }}"
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: BuildKit по digest
        run: >-
          docker buildx create --name antec --driver docker-container
          --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: Сборка с provenance, без публикации
        env:
          PLATFORM: ${{ matrix.platform }}
          CONTEXT: ${{ matrix.context }}
        run: >-
          docker buildx build --builder antec --platform "$PLATFORM"
          --provenance=mode=max --output type=cacheonly "$CONTEXT"

  publish:
    name: "публикация ${{ matrix.name }} ${{ matrix.platform }}"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Вход в GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: BuildKit по digest
        run: >-
          docker buildx create --name antec --driver docker-container
          --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: Сборка и публикация по digest
        env:
          PLATFORM: ${{ matrix.platform }}
          CONTEXT: ${{ matrix.context }}
          REPOSITORY: ${{ matrix.repository }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker buildx build --builder antec --platform "$PLATFORM" --provenance=mode=max \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$REPOSITORY,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" "$CONTEXT"
          digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$digest" > "$RUNNER_TEMP/digests/$NAME--${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: "индексы, подписи, SBOM, release.json, GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: cosign и syft по sha256
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL -o "$bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $bin/cosign" | sha256sum -c -
          chmod +x "$bin/cosign"
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$bin" syft
          echo "$bin" >> "$GITHUB_PATH"
      - name: Вход в GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Индексы, подпись, SBOM
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          out="$RUNNER_TEMP/out"; mkdir -p "$out/sbom"
          echo '{}' > "$out/digests.json"
          for name in $(jq -r '[.[].name] | unique | .[]' <<<"$MATRIX"); do
            repo="$(jq -r --arg n "$name" 'map(select(.name == $n))[0].repository' <<<"$MATRIX")"
            sources=()
            for f in "$RUNNER_TEMP/digests/$name--"*; do sources+=("$repo@$(cat "$f")"); done
            test "${#sources[@]}" -eq "$(jq --arg n "$name" 'map(select(.name == $n)) | length' <<<"$MATRIX")"
            docker buildx imagetools create --tag "$repo:$version" "${sources[@]}"
            index="$(docker buildx imagetools inspect "$repo:$version" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$name $repo@$index"
            # Подпись индекса покрывает манифесты платформ и provenance внутри индекса.
            cosign sign --yes "$repo@$index"
            cosign verify "$repo@$index" --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" > /dev/null
            raw="$(docker buildx imagetools inspect "$repo@$index" --raw)"
            for platform in $(jq -r '[.[].platform] | unique | .[]' <<<"$MATRIX"); do
              os="${platform%/*}"; arch="${platform#*/}"
              pdigest="$(jq -er --arg os "$os" --arg arch "$arch" \
                '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)] | if length == 1 then .[0].digest else error("платформа не одна") end' <<<"$raw")"
              sbom="$out/sbom/antec-$name-$version-$os-$arch.spdx.json"
              syft scan "registry:$repo@$pdigest" --platform "$platform" -o "spdx-json=$sbom"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$repo@$pdigest"
            done
            jq --arg n "$name" --arg d "$index" '. + {($n): $d}' "$out/digests.json" > "$out/d.tmp"
            mv "$out/d.tmp" "$out/digests.json"
          done
      - name: release.json и подпись
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          uv run --project tools/instance --locked antec-instance core-info > "$out/compat.json"
          uv run --project tools/release --locked antec-release manifest --commit "$GITHUB_SHA" \
            --digests "$out/digests.json" --compat "$out/compat.json" --out "$out/release.json"
          cosign sign-blob --yes --bundle "$out/release.json.sigstore.json" "$out/release.json"
          cosign verify-blob --bundle "$out/release.json.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$out/release.json"
          cat "$out/release.json"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          uv run --project tools/release --locked antec-release notes "$(cat VERSION)" > "$out/notes.md"
          gh release create "$TAG" --verify-tag --title "antec.ai $(cat VERSION)" \
            --notes-file "$out/notes.md" \
            "$out/release.json" "$out/release.json.sigstore.json" "$out"/sbom/*.spdx.json
