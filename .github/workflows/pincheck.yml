# Проверка закрепления версий (ADR-0004, ADR-0016).
# Actions закреплены по полному SHA коммита; версия в комментарии. SHA проверены
# через GitHub API (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) 2026-11-21.
name: pincheck

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pincheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv 0.13.8 от 2026-11-12 (вне карантина 7 дней). checksum: sha256 архива
  # uv-x86_64-unknown-linux-gnu.tar.gz из релиза https://github.com/astral-sh/uv/releases/tag/0.13.8
  UV_VERSION: "0.13.8"
  UV_CHECKSUM: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"

jobs:
  test:
    name: "pincheck: ruff, mypy, pytest (Python ${{ matrix.python }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: tools/pincheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked mypy
      - run: uv run --locked pytest

  policy:
    name: "pincheck: реестр, compose, Dockerfile, uv.lock"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      - name: pincheck
        run: >-
          uv run --project tools/pincheck --locked
          pincheck --policy policy/allowed-versions.yaml
          --exclude tools/pincheck/tests/fixtures
          .
      - name: pincheck --require-digest (развёртываемые compose-файлы)
        run: >-
          uv run --project tools/pincheck --locked
          pincheck --policy policy/allowed-versions.yaml --require-digest
          deploy/compose

  compose:
    name: "deploy/compose: конфигурация, скрипты, сборка образов"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Синтаксис shell-скриптов
        # bash -n проверяет только первый файл (остальные становятся его аргументами),
        # поэтому каждый файл отдельно.
        run: |
          set -euo pipefail
          for f in deploy/compose/scripts/*.sh deploy/compose/postgres/init/*.sh; do
            echo "bash -n $f"; bash -n "$f"
          done
          sh -n deploy/compose/openbao/render.sh
          sh -n deploy/compose/common/env-from-files.sh
      - name: Realm как код (JSON)
        run: |
          set -euo pipefail
          for f in deploy/compose/keycloak/*.json; do
            echo "json $f"; python3 -m json.tool "$f" >/dev/null
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      # Скрипты стенда без зависимостей (только stdlib); ruff и mypy берутся из закреплённого
      # окружения pincheck с его правилами, чтобы не заводить второй lock-файл.
      - name: "scripts/*.py: ruff, mypy"
        run: |
          set -euo pipefail
          files=(deploy/compose/scripts/*.py)
          uv run --project tools/pincheck --locked ruff format --check \
            --config tools/pincheck/pyproject.toml "${files[@]}"
          uv run --project tools/pincheck --locked ruff check --output-format=github \
            --config tools/pincheck/pyproject.toml "${files[@]}"
          uv run --project tools/pincheck --locked mypy --strict --python-version 3.12 "${files[@]}"
      - name: "litellm/config.yaml: YAML"
        run: >-
          uv run --project tools/pincheck --locked python -c
          "import yaml; yaml.safe_load(open('deploy/compose/litellm/config.yaml'))"
      # compose.yaml читает производные файлы манифеста dev-инсталляции (ADR-0008).
      - name: Рендер манифеста instances/dev
        run: >-
          uv run --project tools/instance --locked
          antec-instance render instances/dev --out instances/dev/.rendered
      - name: docker compose config
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile bootstrap --profile observability
          config --quiet
      # Тот же образ по digest, что в compose.yaml (components.otel-collector, ADR-0013).
      - name: "observability/otel-collector.yaml: otelcol validate"
        run: |
          set -euo pipefail
          image="$(docker compose -f deploy/compose/compose.yaml --profile observability config --images | grep opentelemetry-collector-contrib)"
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/compose/observability:/cfg:ro" "$image" validate --config=/cfg/otel-collector.yaml
      - name: Сборка localhost/antec/postgres
        run: docker build --tag localhost/antec/postgres:ci deploy/compose/images/postgres
      - name: Сборка localhost/antec/keycloak
        run: docker build --tag localhost/antec/keycloak:ci deploy/compose/images/keycloak
