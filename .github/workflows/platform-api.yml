# Platform API (ADR-0006, ADR-0009): ruff, mypy strict, pytest (включая тесты на PostgreSQL и
# настоящем Cerbos с политиками policies/cerbos), тесты политик Cerbos, сборка образа.
# Actions и uv закреплены как в pincheck.yml; образ PostgreSQL по digest из реестра
# (components.postgresql).
name: platform-api

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # components.cerbos в реестре.
  CERBOS_IMAGE: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
  # Та же версия и checksum, что в pincheck.yml (components.uv в реестре).
  UV_VERSION: "0.13.8"
  UV_CHECKSUM: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"

jobs:
  test:
    name: "platform-api: ruff, mypy, pytest"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/platform-api
    services:
      postgres:
        image: docker.io/library/postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          # Одноразовая БД CI без пароля (AGENTS.md, п. 5: паролей в репозитории нет); порт
          # открыт только на 127.0.0.1 раннера.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.14"
          enable-cache: false
      - name: Cerbos с политиками ядра и dev-инсталляции (как на стенде)
        working-directory: .
        run: >-
          docker run -d --name cerbos -u 65534:65534 -p 127.0.0.1:3592:3592
          -v "$GITHUB_WORKSPACE/policies/cerbos:/policies/core:ro"
          -v "$GITHUB_WORKSPACE/instances/dev/policies:/policies/instance:ro" "$CERBOS_IMAGE" server
          --set=storage.driver=disk --set=storage.disk.directory=/policies
          --set=engine.lenientScopeSearch=true
          --set=telemetry.disabled=true --set=server.apiExplorerEnabled=false
      - name: Cerbos готов
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3592/_cerbos/health && exit 0
            sleep 1
          done
          docker logs cerbos >&2
          exit 1
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked mypy
      - name: pytest (с PostgreSQL и Cerbos)
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
          PLATFORM_TEST_CERBOS_URL: http://127.0.0.1:3592
        run: uv run --locked pytest
      - name: Тесты на PostgreSQL и Cerbos не пропущены
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
          PLATFORM_TEST_CERBOS_URL: http://127.0.0.1:3592
        run: |
          set -euo pipefail
          out="$(uv run --locked pytest -m 'db or cerbos' -q -rs)"
          echo "$out" | tail -3
          if grep -q skipped <<<"$out"; then echo "тесты db или cerbos пропущены" >&2; exit 1; fi

  policies:
    name: "policies/cerbos и instances/dev: компиляция и тесты политик"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cerbos compile (с тестами), только ядро
        run: >-
          docker run --rm -u 65534:65534 -v "$GITHUB_WORKSPACE/policies/cerbos:/policies:ro"
          "$CERBOS_IMAGE" compile --verbose /policies
      # Тот же образ по digest из compose.yaml, дерево как на стенде (ADR-0008).
      - name: cerbos compile (с тестами), ядро и instances/dev
        run: deploy/compose/scripts/policies-check.sh instances/dev

  image:
    name: "platform-api: сборка образа"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сборка localhost/antec/platform-api
        run: docker build --tag localhost/antec/platform-api:ci services/platform-api
      - name: Образ без root, пакет и миграции на месте
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id localhost/antec/platform-api:ci -u)" = 65534
          docker run --rm --entrypoint python localhost/antec/platform-api:ci -c \
            "import importlib.resources as r; assert (r.files('antec_platform') / 'migrations' / 'versions' / '0001_initial.py').is_file()"
          docker run --rm localhost/antec/platform-api:ci --help

  # Обновление с предыдущего релиза (ADR-0014, п. 7): миграции и audit.sql тега N-1, затем
  # текущего кода на той же БД. До первого тега job ничего не проверяет и пишет об этом.
  upgrade:
    name: "platform-api: обновление БД с предыдущего релиза"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.14"
          enable-cache: false
      - name: Предыдущий релиз
        id: prev
        run: |
          set -euo pipefail
          # Последний тег vX.Y.Z до текущего коммита (сам коммит тега не считается).
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "::notice::релизных тегов ещё нет: проверка обновления пропущена"
          else
            git worktree add --detach "$RUNNER_TEMP/prev" "$prev"
          fi
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
      - name: Миграции N-1, затем текущие
        if: steps.prev.outputs.tag != ''
        env:
          PREV: ${{ runner.temp }}/prev
          PGURL: postgresql://postgres@127.0.0.1:5432
          PGOPTIONS: "-c client_min_messages=warning"
        run: |
          set -euo pipefail
          # Одноразовая БД CI: пароль случайный и живёт только в этом job.
          PLATFORM_DATABASE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export PLATFORM_DATABASE_PASSWORD PLATFORM_DATABASE_HOST=127.0.0.1 \
            PLATFORM_DATABASE_USER=platform PLATFORM_DATABASE_NAME=platform
          psql "$PGURL/postgres" -v ON_ERROR_STOP=1 -q -v pw="$PLATFORM_DATABASE_PASSWORD" <<'SQL'
          create role platform login password :'pw';
          create role platform_app login;
          create role platform_worker login;
          create role platform_subject login;
          create database platform owner platform;
          revoke all on database platform from public;
          \connect platform
          revoke all on schema public from public;
          alter schema public owner to platform;
          SQL
          migrate() { uv run --project "$1/services/platform-api" --locked antec-platform migrate "${@:2}"; }
          migrate "$PREV"
          psql "$PGURL/platform" -v ON_ERROR_STOP=1 -q -f "$PREV/deploy/compose/postgres/audit.sql"
          rc=0; migrate . --plan || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || { echo "план миграций: код $rc" >&2; exit 1; }
          migrate .
          psql "$PGURL/platform" -v ON_ERROR_STOP=1 -q -f deploy/compose/postgres/audit.sql
          # Повтор audit.sql идемпотентен, план пуст.
          psql "$PGURL/platform" -v ON_ERROR_STOP=1 -q -f deploy/compose/postgres/audit.sql
          migrate . --plan
