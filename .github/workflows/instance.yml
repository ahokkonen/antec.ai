# tools/instance (ADR-0008): ruff, mypy strict, pytest; проверка instances/dev и инсталляции,
# созданной из templates/instance, вместе с политиками ядра в Cerbos.
# Actions и uv закреплены как в pincheck.yml; образ Cerbos берёт policies-check.sh из compose.yaml.
name: instance

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: instance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Та же версия и checksum, что в pincheck.yml (components.uv в реестре).
  UV_VERSION: "0.13.8"
  UV_CHECKSUM: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"

jobs:
  test:
    name: "tools/instance: ruff, mypy, pytest, шаблон и instances/dev"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - name: ruff, mypy, pytest
        working-directory: tools/instance
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check --output-format=github .
          uv run --locked mypy
          uv run --locked pytest
      - name: instances/dev
        run: uv run --project tools/instance --locked antec-instance validate instances/dev
      - name: Инсталляция из шаблона
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/instance-ci"
          uv run --project tools/instance --locked antec-instance init "$dest" --id ci --name "CI Oy"
          uv run --project tools/instance --locked antec-instance validate "$dest"
          deploy/compose/scripts/policies-check.sh "$dest"
