# tools/instance (ADR-0008): ruff, mypy strict, pytest; проверка instances/dev и инсталляции,
# и тестовый MCP-сервер dev-инсталляции (ADR-0010);
# созданной из templates/instance, вместе с политиками ядра в Cerbos.
# Actions и uv закреплены как в pincheck.yml; образ Cerbos берёт policies-check.sh из compose.yaml.
name: instance

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: instance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Та же версия и checksum, что в pincheck.yml (components.uv в реестре).
  UV_VERSION: "0.13.8"
  UV_CHECKSUM: "5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91"

jobs:
  test:
    name: "tools/instance: ruff, mypy, pytest, шаблон и instances/dev"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - name: ruff, mypy, pytest
        working-directory: tools/instance
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check --output-format=github .
          uv run --locked mypy
          uv run --locked pytest
      - name: instances/dev
        run: uv run --project tools/instance --locked antec-instance validate instances/dev
      - name: Инсталляция из шаблона
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/instance-ci"
          uv run --project tools/instance --locked antec-instance init "$dest" --id ci --name "CI Oy"
          uv run --project tools/instance --locked antec-instance validate "$dest"
          deploy/compose/scripts/policies-check.sh "$dest"
      # Образы ядра по digest (ADR-0014, п. 6): core-images.yaml с тестовыми digest вместо
      # core-pin (подпись релиза проверяется тестами tools/instance с поддельным cosign).
      - name: Инсталляция с образами ядра по digest
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/instance-ci"
          version="$(cat VERSION)"
          {
            echo "schema_version: 1"
            echo "core_version: \"$version\""
            echo "commit: \"$GITHUB_SHA\""
            echo "release_sha256: \"$(printf '0%.0s' $(seq 64))\""
            echo "images:"
            for pair in platform-api:a postgres:b keycloak:c; do
              name="${pair%%:*}"; hex="$(printf "${pair##*:}%.0s" $(seq 64))"
              echo "  $name: {repository: ghcr.io/ahokkonen/antec-$name, tag: \"$version\", digest: \"sha256:$hex\"}"
            done
          } > "$dest/core-images.yaml"
          uv run --project tools/instance --locked antec-instance render "$dest" --out "$dest/.rendered"
          uv run --project tools/pincheck --locked pincheck --policy policy/allowed-versions.yaml \
            --require-digest --core-images "$dest/core-images.yaml" "$dest"
          ANTEC_INSTANCE_DIR="$dest" docker compose --project-directory deploy/compose \
            -f deploy/compose/compose.yaml -f "$dest/.rendered/compose.core-images.yaml" \
            --profile bootstrap config --format json > "$RUNNER_TEMP/config.json"
          python3 - "$RUNNER_TEMP/config.json" "$version" <<'PY'
          import json, sys
          services = json.load(open(sys.argv[1]))["services"]
          for name in ("postgres", "keycloak", "platform-api", "platform-migrate", "platform-worker", "platform-subject"):
              svc = services[name]
              assert svc["image"].startswith("ghcr.io/ahokkonen/antec-"), (name, svc["image"])
              assert f":{sys.argv[2]}@sha256:" in svc["image"], (name, svc["image"])
              assert "build" not in svc and svc["pull_policy"] == "missing", (name, svc)
          print("образы ядра по digest:", len(services), "сервисов")
          PY

  mcp-demo:
    name: "instances/dev/plugins/mcp-demo: ruff, mypy, pytest, сборка образа"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: instances/dev/plugins/mcp-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.14"
          enable-cache: false
      - name: ruff, mypy, pytest
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check --output-format=github .
          uv run --locked mypy
          uv run --locked pytest
      - name: Сборка образа, пользователь без root
        run: |
          set -euo pipefail
          docker build --tag localhost/antec/mcp-demo:ci .
          test "$(docker run --rm --entrypoint id localhost/antec/mcp-demo:ci -u)" = 65534
