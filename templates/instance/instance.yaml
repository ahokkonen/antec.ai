# Манифест инсталляции __INSTANCE_NAME__ (ADR-0008). Схема v1: tools/instance ядра.
# Проверка: uv run --project core/tools/instance --locked antec-instance validate .
schema_version: 6
instance:
  # id = scope политик Cerbos инсталляции (policies/), менять нельзя.
  id: __INSTANCE_ID__
  name: "__INSTANCE_NAME__"
core:
  # Версия ядра в submodule core/ (файл core/VERSION).
  version: "__CORE_VERSION__"

# Логические модели: клиенты знают только имя, провайдер меняется здесь (ADR-0001).
# api_key только ссылкой на переменную, которую ядро выгружает из OpenBao.
models:
  - name: chat-default
    description: "Модель по умолчанию: Claude Opus 5.5"
    litellm:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    # Условия договора с провайдером (ADR-0015): zdr = провайдер не хранит данные по договору.
    provider_terms: {zdr: false, region: unknown}
  - name: chat-fast
    description: "Быстрая и дешёвая модель: Claude Haiku 5.5"
    litellm:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    # Условия договора с провайдером (ADR-0015): zdr = провайдер не хранит данные по договору.
    provider_terms: {zdr: false, region: unknown}

# MCP-серверы инсталляции (исполняются вместе с MCP-клиентом Platform API). Пример:
# mcp_servers:
#   - name: crm
#     url: http://mcp-crm:8080/mcp
#     audience: mcp-crm               # аудитория token exchange (ADR-0007)
#     protocol_version: "2026-07-28"
#     tools:
#       - {name: search_contacts, read_only: true, data_class: confidential}
#       - {name: create_deal}         # без read_only: только с подтверждением человека
#     secrets: [api_token]            # OpenBao antec/plugins/crm
mcp_servers: []

# Агенты (ADR-0010): имя agent-<имя>, модель из models, инструкции текстом или файлом,
# инструменты <mcp_server>.<tool> из mcp_servers. Пример:
# agents:
#   - name: agent-sales
#     description: "Помощник отдела продаж"
#     model: chat-default
#     instructions_file: agents/sales.md
#     tools: [crm.search_contacts, crm.create_deal]
#     max_steps: 10
#     max_tool_calls: 20
agents: []

# Классы данных (ADR-0011): public < internal < confidential < restricted. Ввод пользователя
# получает default_class; модель с max_data_class ниже не используется, инструмент с data_class
# выше допуска модели агента отклоняется до вызова. У моделей по умолчанию max_data_class:
# restricted, у инструментов data_class = default_class.
data:
  default_class: internal

# Сроки хранения, дни (ADR-0012): тексты 30-180, метаданные и аудит 180-730.
retention:
  content_days: 90
  metadata_days: 365
  audit_days: 365
  telemetry_days: 30

# Наблюдаемость (ADR-0013): OTel Collector, VictoriaMetrics/Logs/Traces, Grafana и алерты.
observability:
  enabled: true
  # alert_email: "ops@example.invalid"

# Комплаенс (ADR-0015). operator_role: controller (организация сама контролёр) или processor
# (Mtech обработчик клиента: нужны controller и processor). Документы: docs/compliance/;
# черновики реестра и фактов DPIA пишет render в .rendered/compliance/.
compliance:
  operator_role: controller
  controller: {name: "__INSTANCE_NAME__", contact: "privacy@example.invalid"}
  # dpo_contact: "dpo@example.invalid"
  # privacy_notice_url: https://example.invalid/privacy
  # Свой текст уведомления об ИИ по языку интерфейса (иначе текст ядра на en, fi, ru):
  # ai_notice: {fi-FI: "Keskustelet tekoälyn kanssa."}
  require_zdr: false

# Параметры Platform API, которые может менять инсталляция.
settings:
  allowed_clients: [open-webui]
