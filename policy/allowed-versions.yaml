# Реестр разрешённых версий (allowlist) и запрещённых артефактов (denylist).
#
# Источник истины для docker-compose, Dockerfile и lock-файлов.
# Правила работы с реестром: docs/adr/0004-dependency-pinning-and-supply-chain.md
#
# Поля:
#   allowed       версии, разрешённые к развёртыванию (первая = текущая), без префикса:
#                 только числа через точку, например "1.108.7"
#   image_tag_prefix  префикс тега образа перед версией (например "v": тег v1.108.7)
#   candidate     следующая версия: проходит карантин и ревью, пока НЕ разрешена
#   min_version   ниже этой версии запрещено (CVE, смена ключа подписи и т.п.)
#   image         репозиторий образа без тега и digest; null, если образа нет
#                 или он ещё не выбран (тогда пояснение в note)
#   digest        sha256 индекса образа для первой версии из allowed; заполняется
#                 при первом pull после проверки подписи и denylist. null = ещё не
#                 зафиксирован: pincheck выдаёт предупреждение, а с --require-digest
#                 (prod, репозитории инсталляций) ошибку (ADR-0016)
#   denied        известные вредоносные или отозванные версии, теги, дайджесты.
#                 Каждая запись image_digests / image_digest_prefixes содержит
#                 source (https), confidence (multi-source | single-source) и,
#                 для multi-source, corroborated_by. image_digest_prefixes: усечённые
#                 digest не короче 12 hex-символов, сверка по префиксу.
#   floating_tags_forbidden  теги, которые нельзя использовать никогда
#   prerelease_forbidden     пре-релизы (rc, beta, alpha, dev) запрещены всегда (ADR-0016)
#   note          свободное пояснение к компоненту
#
# Проверка: tools/pincheck (ADR-0016), запускается в CI на каждый PR.
#
# Даты в ISO 8601. Каждое изменение файла только через PR с ревью.

schema_version: 1
reviewed_at: 2026-11-21
quarantine_days: 7            # не-security релизы не ставим раньше, чем через 7 дней
defaults:
  floating_tags_forbidden: [latest, main, main-latest, main-stable, dev, nightly, edge]
  prerelease_forbidden: true   # rc, beta, alpha, dev; всегда, не только в prod (ADR-0016)

components:

  litellm:
    role: llm-gateway
    license: "MIT, кроме каталога enterprise/ (коммерческая лицензия)"
    image: ghcr.io/berriai/litellm   # вариант образа (litellm / litellm-database / litellm-non_root) уточнить в PoC
    allowed: ["1.108.7"]             # линия LTS 1.108; проверить release notes перед первым pull
    image_tag_prefix: "v"            # теги образов LiteLLM с префиксом v: v1.108.7
    candidate:
      version: "1.110.0"             # stable от 2026-11-18, первая stable с keyless-подписью
      not_before: 2026-11-25
    min_version: "1.106.3"           # первая версия после октябрьского инцидента, подписана новым ключом
    digest: null
    signature:
      method: "cosign: keyless (Sigstore) с 1.110.0; новый ключ для 1.103.8+, 1.104.6+, 1.105.4+, 1.106.3+"
      note: "Валидная подпись НЕ доказывает чистоту: 1.107.0 подписан старым ключом. Всегда сверять digest с denylist."
      howto: https://docs.litellm.ai/docs/proxy/docker_image_security
    denied:
      pypi: ["1.82.7", "1.82.8", "1.107.0"]
      image_tags: ["v1.107.0"]
      image_digests:
        - digest: "sha256:1bbcb1443bc962e45f5aad53fe3d2c30600e0379715fb6c664cdd3ac126c339e"
          image: ghcr.io/berriai/litellm
          source: https://docs.litellm.ai/blog/security-incident-oct-21-2026
          confidence: multi-source
          corroborated_by:
            - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          note: "Индекс v1.107.0; тот же индекс у docker.io/litellm/litellm"
        - digest: "sha256:bd1aeee419ea36da9aa2b657288da4101887be468f020ac63d22ba6ed84a3ea5"
          image: ghcr.io/berriai/litellm
          source: https://github.com/BerriAI/litellm/issues/47826
          confidence: multi-source
          corroborated_by:
            - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          note: "Платформенный манифест v1.107.0, linux/amd64"
        - digest: "sha256:56b74573eed6e4aafe4b50603dbe7853e0345f188c8e44a09f1098caf1f4bcdf"
          image: ghcr.io/berriai/litellm
          source: https://github.com/BerriAI/litellm/issues/47826
          confidence: multi-source
          corroborated_by:
            - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          note: "Платформенный манифест v1.107.0, linux/arm64"
        - digest: "sha256:24581ddc30767f16ecb69d2b0517556f2cd7dea56971adb42a3d1beb97d69523"
          image: ghcr.io/berriai/litellm-database
          source: https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          confidence: single-source
          note: "Платформенный манифест v1.107.0, linux/amd64"
        - digest: "sha256:827dd893c74cf621a860a66a3a447a5c732533f087589ce905573e285c0a239c"
          image: ghcr.io/berriai/litellm-database
          source: https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          confidence: single-source
          note: "Платформенный манифест v1.107.0, linux/arm64"
        - digest: "sha256:645a67d810628252d63df85dcc8824c58bcc77cf8383f4d3e6321f0ccc3ce9e4"
          image: ghcr.io/berriai/litellm-non_root
          source: https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          confidence: single-source
          note: "Платформенный манифест v1.107.0, linux/amd64"
        - digest: "sha256:f75c8edae59b72b1ebfd617295833f465c85bb2fab9c1d60f21b496db86cb8da"
          image: ghcr.io/berriai/litellm-non_root
          source: https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
          confidence: single-source
          note: "Платформенный манифест v1.107.0, linux/arm64"
      # Индексы v1.107.0, опубликованные только усечёнными. pincheck сверяет по префиксу
      # (минимум 12 hex-символов, ADR-0016).
      # TODO: заменить префиксы полными digest в image_digests, когда появится второй
      # источник с полным значением (на 2026-11-21 везде только усечённые).
      image_digest_prefixes:
        - prefix: "sha256:c00f9d92c427"
          image: ghcr.io/berriai/litellm-database
          source: https://docs.litellm.ai/blog/security-incident-oct-21-2026
          confidence: multi-source
          corroborated_by:
            - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
            - https://github.com/BerriAI/litellm/issues/47826
          note: "Индекс v1.107.0, усечённый"
        - prefix: "sha256:7b00e91cd2fe"
          image: ghcr.io/berriai/litellm-non_root
          source: https://docs.litellm.ai/blog/security-incident-oct-21-2026
          confidence: multi-source
          corroborated_by:
            - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
            - https://github.com/BerriAI/litellm/issues/47826
          note: "Индекс v1.107.0, усечённый"
      note: "21.10.2026 теги latest, main-latest, main-stable указывали на вредоносные образы litellm, litellm-database, litellm-non_root"
    python_package_policy: "Пакет litellm не импортируется в наш код. Только HTTP к контейнеру."
    advisories:
      - id: GHSA-92x9-889m-jgmw / MAL-2026-2144
        summary: "Компрометация релиза 1.107.0 (21.10.2026)"
      - id: "март 2026"
        summary: "Компрометация 1.82.7 и 1.82.8 через заражённый Trivy GitHub Action"
      - id: GHSA-w4c7-34wj-hqm8
        summary: "Чтение файлов без аутентификации, только для прокси с enterprise-лицензией; мы enterprise не используем"
      - id: CVE-2026-114612
        summary: "Эскалация прав администратора прокси; исправлено в 1.100.4, 1.101.3, 1.102.2, 1.103.1 и новее"
    sources:
      - https://www.konfirmity.com/advisories/litellm-1-107-0-supply-chain-compromise
      - https://www.mend.io/blog/litellm-1-107-0-compromised/
      - https://snyk.io/articles/poisoned-security-scanner-backdooring-litellm
      - https://privacysafe.app/docs/security-patches/litellm/
      - https://docs.litellm.ai/blog/security-incident-oct-21-2026
      - https://github.com/BerriAI/litellm/issues/47826

  open-webui:
    role: chat-ui
    license: "Open WebUI License: BSD-3 + запрет менять брендинг при >50 пользователях за 30 дней (не OSI)"
    image: ghcr.io/open-webui/open-webui   # без суффиксов :cuda / :ollama
    allowed: ["0.13.3"]            # от 2026-11-08
    image_tag_prefix: "v"          # тег образа v0.13.3
    candidate:
      version: "0.13.4"            # от 2026-11-19: проверить release notes и GHSA
      not_before: 2026-11-26
    min_version: "0.11.0"          # CVE-2026-70487 исправлена в v0.11.0; серия IDOR/доступа в 2026
    digest: null
    signature:
      method: "не установлено; проверить, подписывает ли проект образы"
    denied:
      image_tags: []
      image_digests: []
    advisories:
      - id: CVE-2026-70487
        summary: "Раскрытие файлов других пользователей; исправлено в v0.11.0"
      - id: CVE-2026-54012
        summary: "Чтение и удаление файлов других пользователей через meta.knowledge; исправлено до v0.9.6"
      - id: "CSA research note, 2026-07-10"
        summary: "Не менее шести уязвимостей broken access control с ноября 2025 по июнь 2026"
    sources:
      - https://docs.openwebui.com/license/
      - https://github.com/open-webui/open-webui/releases
      - https://advisories.gitlab.com/pypi/open-webui/CVE-2026-70487/

  postgresql:
    role: datastore
    license: PostgreSQL License
    image: docker.io/library/postgres   # база собственной сборки deploy/compose/images/postgres
    note: "Используется только как FROM в localhost/antec/postgres (postgres + pgvector из PGDG)"
    allowed: ["18.7"]              # от 2026-11-12
    min_version: "18.7"            # 18.7 закрывает пакет security-исправлений
    # Индекс тега 18.7 от 2026-11-20 (пересборка docker-library: PG_VERSION 18.7-1.pgdg13+5).
    # Пересборка уже разрешённой версии допущена без 7-дневного карантина (ADR-0017).
    digest: "sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a"
    signature:
      method: "cosign-подписи нет; проверен BuildKit provenance (неподписанный)"
      note: "provenance: docker-library/postgres@31f4af9d429410ba4ad1f6e394daecd9ae7edfa7:18/trixie, совпадает с library/postgres в docker-library/official-images для тега 18.7; проверено 2026-11-21"
    sources:
      - https://www.postgresql.org/docs/18/release-18-7.html
      - https://github.com/docker-library/official-images/blob/master/library/postgres

  pgvector:
    role: vector-extension
    license: PostgreSQL License
    allowed: ["0.8.7"]             # от 2026-10-05
    min_version: "0.8.7"           # CVE-2026-103484 (IVFFlat, выполнение кода)
    note: "Ставится пакетом PGDG postgresql-18-pgvector=0.8.7-1.pgdg13+2 (подпись apt PGDG) в deploy/compose/images/postgres/Dockerfile; тег v0.8.7 = коммит f37c13f68b57d2c3472b2214fbcff699d6d34876"
    sources:
      - https://www.postgresql.org/message-id/179116294741.1252.17308312335154774817%40wrigleys.postgresql.org

  keycloak:
    role: oidc-provider
    license: Apache-2.0
    image: quay.io/keycloak/keycloak
    allowed: ["26.8.2"]            # от 2026-11-05
    min_version: "26.8.2"          # в 26.8.1/26.8.2 закрыто более 10 CVE
    digest: null
    sources:
      - https://www.keycloak.org/2026/11/keycloak-2682-released

  openbao:
    role: secrets
    license: MPL-2.0
    image: ghcr.io/openbao/openbao  # тот же индекс на quay.io/openbao и docker.io/openbao
    allowed: ["2.7.2"]             # от 2026-10-26
    min_version: "2.7.2"
    digest: "sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"
    signature:
      method: "cosign keyless (Sigstore), identity https://github.com/openbao/openbao/.github/workflows/release-images.yml@refs/tags/v2.7.2, issuer https://token.actions.githubusercontent.com"
      note: "Проверено 2026-11-21 cosign 3.1.4; тег v2.7.2 = коммит 9e0a0d3c3504a0a00b45e61355afac5e35c78379"
    sources:
      - https://openbao.org/community/release-notes/2-7-0/
      - https://github.com/openbao/openbao/releases/tag/v2.7.2

  cerbos:
    role: policy-decision-point
    license: Apache-2.0
    image: ghcr.io/cerbos/cerbos
    allowed: []                    # зафиксировать в PoC: линия 0.56.x
    digest: null
    sources:
      - https://www.cerbos.dev/blog

  otel-collector:
    role: telemetry-pipeline
    license: Apache-2.0
    allowed: []                    # зафиксировать в PoC
    digest: null

  victoria-metrics:
    role: metrics
    license: Apache-2.0
    allowed: []                    # зафиксировать в PoC
    digest: null

  victoria-logs:
    role: logs
    license: Apache-2.0
    allowed: []                    # зафиксировать в PoC
    digest: null

  grafana:
    role: dashboards
    license: "AGPL-3.0: только отдельный немодифицированный сервис (docs/security/licensing.md)"
    allowed: []                    # зафиксировать в PoC
    digest: null

  reverse-proxy:
    role: ingress
    license: "выбрать Caddy или Traefik в PoC, проверить лицензию"
    allowed: []
    digest: null

# Компонент с пустым allowed не может быть развёрнут.

# Python-зависимости собственных сервисов фиксируются в uv.lock (с хэшами)
# и устанавливаются только через `uv sync --locked`. Этот реестр задаёт для них
# запреты и минимальные версии, uv.lock не дублирует.
#   python_forbidden     пакеты, которых не должно быть в uv.lock ни в какой версии
#   python_denylist      конкретные запрещённые версии
#   python_min_versions  минимальные разрешённые версии
python_forbidden:
  - litellm            # ADR-0001: пакет не импортируем, только HTTP к контейнеру
python_denylist:
  litellm: ["1.82.7", "1.82.8", "1.107.0"]
python_min_versions: {}
