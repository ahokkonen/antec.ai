[project]
name = "antec-release"
version = "0.1.0"
description = "Релизы ядра antec.ai: единая версия, CHANGELOG, release.json (ADR-0014)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
antec-release = "antec_release.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Карантин 7 дней (ADR-0004) для всех зависимостей, включая транзитивные.
# Сдвигать дату только PR с проверкой новых версий.
exclude-newer = "2026-11-14T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "ANN", "PTH", "C4", "PT", "RET",
]
# Документы и сообщения на русском: кириллица не является «неоднозначным» символом.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
