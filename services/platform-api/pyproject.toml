[project]
name = "antec-platform"
version = "0.1.0"
description = "Platform API antec.ai: OpenAI-совместимый фасад, пользователи, история, аудит (ADR-0006)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32.0,<0.33",
    "fastapi>=0.163.0,<0.164",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.3,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
antec-platform = "antec_platform.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Карантин 7 дней (ADR-0004, ADR-0016, п. 6) для всех зависимостей, включая транзитивные.
# Сдвигать дату только PR с проверкой новых версий (лицензия, OSV).
exclude-newer = "2026-11-15T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "ANN", "PTH", "C4", "PT", "RET",
    "ASYNC",
]
# Документы и сообщения на русском: кириллица не является «неоднозначным» символом.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["db: тесты с настоящим PostgreSQL (PLATFORM_TEST_DATABASE_URL)"]
filterwarnings = [
    "error",
    # Каталог секретов есть только в контейнере; в тестах настройки задаются явно.
    'ignore:directory "/run/antec-secrets" does not exist:UserWarning',
]
