# Правила алертов ядра (ADR-0013, п. 6). Копируется рендером инсталляции в
# .rendered/grafana/alerting вместе с получателем из манифеста.
apiVersion: 1
groups:
  - orgId: 1
    name: antec-platform
    folder: antec.ai
    interval: 1m
    rules:
      - uid: antec-api-down
        title: Platform API не отдаёт телеметрию
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: Нет antec_service_up от antec-platform-api 5 минут
        labels: {severity: critical}
        data:
          - refId: A
            datasourceUid: vm
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'max(max_over_time(antec_service_up{service_name="antec-platform-api"}[5m]))', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}
      - uid: antec-facade-5xx
        title: Доля ошибок 5xx фасада выше 5%
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Ошибки 5xx Platform API выше 5% за 10 минут
        labels: {severity: warning}
        data:
          - refId: A
            datasourceUid: vm
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{service_name="antec-platform-api",http_response_status_code=~"5.."}[10m])) / sum(rate(http_server_request_duration_seconds_count{service_name="antec-platform-api"}[10m]))'
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0.05]}}]}
      - uid: antec-model-errors
        title: Доля ошибок вызовов моделей выше 20%
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Вызовы моделей с итогом error выше 20% за 15 минут (шлюз или провайдер)
        labels: {severity: warning}
        data:
          - refId: A
            datasourceUid: vm
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: A
              instant: true
              expr: 'sum(increase(antec_model_calls_total{antec_status="error"}[15m])) / sum(increase(antec_model_calls_total[15m]))'
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0.2]}}]}
      - uid: antec-worker-stalled
        title: platform-worker не выполняет проходы
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: Нет успешных проходов platform-worker 10 минут (сроки хранения и потерянные вызовы)
        labels: {severity: critical}
        data:
          - refId: A
            datasourceUid: vm
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: 'sum(increase(antec_worker_sweeps_total{antec_status="ok"}[10m]))'}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}
      - uid: antec-disk-low
        title: Мало места на томе VictoriaMetrics
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: Свободно меньше 5 GiB на диске с томами стенда
        labels: {severity: warning}
        data:
          - refId: A
            datasourceUid: vm
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: 'min(vm_free_disk_space_bytes)'}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [5368709120]}}]}
