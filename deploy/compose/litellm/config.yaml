# LiteLLM 1.108.8, локальный стенд (ADR-0001, ADR-0018).
# Конфигурация моделей в git (GitOps): STORE_MODEL_IN_DB выключен, модели не меняются через API.
# Секреты только ссылками os.environ/: значения выгружает из OpenBao secrets-render, обёртка
# common/env-from-files.sh кладёт их в окружение процесса (не контейнера).

# Логические модели задаёт манифест инсталляции (ADR-0008): tools/instance render пишет
# litellm/models.yaml (только model_list), этот подкаталог рендера монтируется как /antec/instance.
# Клиенты (Platform API, Open WebUI, coding-агенты) знают только логические имена; смена
# провайдера или модели не меняет клиентов (ADR-0001, план выхода). Другие ключи в включаемом
# файле заменили бы настройки ниже целиком, поэтому рендер пишет только model_list.
include:
  - instance/models.yaml

litellm_settings:
  # Параметры OpenAI, которых нет у провайдера, отбрасываются, а не дают 400.
  drop_params: true
  # Ответы и запросы не пишутся в логи и БД расходов (персональные данные, ADR-0012).
  turn_off_message_logging: true
  # Каждый запрос в одну попытку на шлюзе: повторы решает вызывающий (Platform API).
  num_retries: 0
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Вход в админку по UI_USERNAME/UI_PASSWORD и мастер-ключу выключен; сама админка выключена
  # переменной DISABLE_ADMIN_UI (compose.yaml).
  disable_env_credential_login: true
  # Мастер-ключ не возвращается в ответах management API.
  disable_master_key_return: true
  # Конечный пользователь для учёта и бюджетов: поле `user` запроса или этот заголовок
  # (Open WebUI на стенде до Platform API, ADR-0018). LiteLLM принимает и то и другое от
  # любого ключа: конечного пользователя утверждает вызывающий. Поэтому ключи, выданные
  # людям (coding-агенты), получают собственный бюджет ключа и не полагаются на бюджеты
  # конечных пользователей (ADR-0018, решение 6).
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: customer
  # Пул соединений с PostgreSQL: лимит роли litellm 50 (ADR-0017).
  database_connection_pool_limit: 20
