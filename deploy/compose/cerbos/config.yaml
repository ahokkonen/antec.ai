# Cerbos PDP стенда (ADR-0009, ADR-0008). Политики только с диска, только чтение, без Cerbos Hub:
# /policies/core = policies/cerbos ядра (без scope), /policies/instance = policies/ инсталляции
# (scope = id инсталляции). Изменения политик применяются перезапуском (up.sh пересоздаёт контейнер по хэшу).
server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"
  apiExplorerEnabled: false
  adminAPI:
    enabled: false
  logRequestPayloads: false
  # Только Platform API по сети policy; браузеры сюда не ходят.
  cors:
    disabled: true
engine:
  defaultPolicyVersion: "default"
  # Виды ресурсов, которые инсталляция не переопределила в своём scope, решают политики ядра
  # (ADR-0008, п. 4); scope политик инсталляции сверяет tools/instance validate.
  lenientScopeSearch: true
storage:
  driver: "disk"
  disk:
    directory: /policies
    watchForChanges: false
schema:
  enforcement: reject
# Источник истины решений: аудит Platform API (audit_events).
audit:
  enabled: false
telemetry:
  disabled: true
