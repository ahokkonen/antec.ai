# Локальный стенд antec.ai: базовый слой OpenBao + PostgreSQL (ADR-0003, ADR-0017),
# Keycloak (ADR-0007), LiteLLM и Open WebUI (ADR-0018), Platform API (ADR-0006), Cerbos (ADR-0009).
# Образы только по digest из policy/allowed-versions.yaml (ADR-0004).
# Запуск только через scripts/up.sh: он распечатывает OpenBao, выгружает секреты
# (secrets-render) и только потом запускает PostgreSQL и Keycloak.
name: antec

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  openbao:
    <<: *hardening
    image: ghcr.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server"]
    # entrypoint образа делает chown каталогов и сбрасывает root через su-exec
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    networks: [secrets]
    mem_limit: 256m
    healthcheck:
      # bao status: 0 = распечатан, 2 = запечатан. Healthy только после unseal.
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Одноразовая выгрузка секретов; запускается только из scripts/up.sh
  # (`compose run ... secrets-render <цель>`), токен передаётся через stdin.
  secrets-render:
    profiles: [bootstrap]
    image: ghcr.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/render/render.sh"]
    user: "0:0"   # нужен chown файлов на uid сервиса
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao/render.sh:/render/render.sh:ro
      - postgres-secrets:/out/postgres
      - keycloak-secrets:/out/keycloak
      - litellm-secrets:/out/litellm
      - open-webui-secrets:/out/open-webui
      - platform-api-secrets:/out/platform-api
      - platform-migrate-secrets:/out/platform-migrate
    networks: [secrets]
    depends_on:
      openbao:
        condition: service_healthy

  postgres:
    <<: *hardening
    build:
      context: ./images/postgres
    image: localhost/antec/postgres:18.7-pgvector0.8.7
    pull_policy: build
    command: ["postgres", "-c", "max_connections=250", "-c", "password_encryption=scram-sha-256"]
    # entrypoint образа делает chown PGDATA и сбрасывает root через gosu
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    environment:
      POSTGRES_PASSWORD_FILE: /run/antec-secrets/superuser
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-secrets:/run/antec-secrets:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -q"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  keycloak:
    <<: *hardening
    build:
      context: ./images/keycloak
    image: localhost/antec/keycloak:26.8.2
    pull_policy: build
    # Несекретные опции здесь; секретные (пароль БД, bootstrap-клиент) в keycloak.conf,
    # который secrets-render выгружает из OpenBao. Секрет клиента Entra в vault-файле.
    command:
      # --config-file задаётся до команды start (опция kc.sh, не start).
      - --config-file=/run/antec-secrets/keycloak.conf
      - start
      - --optimized
      - --vault-dir=/run/antec-secrets/vault
      - --db-url=jdbc:postgresql://postgres:5432/keycloak
      - --db-username=keycloak
      - --db-pool-max-size=20
      # Локальный стенд: HTTP только на 127.0.0.1 хоста. На сервере TLS через reverse proxy.
      - --hostname=http://localhost:8080
      - --hostname-backchannel-dynamic=true
      - --http-enabled=true
      - --http-port=8080
      # Один узел: локальный кэш без кластерного Infinispan (HA на продакшне отдельно).
      - --cache=local
      - --log-console-output=default
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /opt/keycloak/data:size=64m,uid=1000,gid=0,mode=0700
    volumes:
      - keycloak-secrets:/run/antec-secrets:ro
    networks: [data, egress, ui]
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1536m
    healthcheck:
      # В образе нет curl: запрос к /health/ready порта управления через /dev/tcp.
      test:
        - CMD-SHELL
        # Готовность только по коду 200: в теле 503 тоже встречается "UP" (вложенные проверки).
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  litellm:
    <<: *hardening
    image: ghcr.io/berriai/litellm-non_root:v1.108.8@sha256:ea2d1a480818e51db8ec8219c7973abfaeb9a82841f91c1722d4e060ec019d51
    # Обёртка переносит секреты из файлов в окружение процесса LiteLLM (ADR-0018).
    entrypoint: ["/bin/sh", "/antec/env-from-files.sh", "/app/docker/prod_entrypoint.sh"]
    command: ["--config", "/antec/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      # Карта цен моделей из образа, без загрузки из интернета при старте.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Админка выключена: управление ключами и бюджетами только через API (ADR-0001).
      DISABLE_ADMIN_UI: "True"
      NO_DOCS: "True"
      STORE_MODEL_IN_DB: "False"
      # Хэш litellm/config.yaml и обёртки (scripts/lib.sh): при их изменении up.sh пересоздаёт
      # контейнер, хотя файлы смонтированы bind-mount.
      ANTEC_CONFIG_SHA: ${ANTEC_LITELLM_CONFIG_SHA:-}
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=65534,gid=65534
    volumes:
      - ./litellm/config.yaml:/antec/config.yaml:ro
      - ./common/env-from-files.sh:/antec/env-from-files.sh:ro
      - litellm-secrets:/run/antec-secrets:ro
    # data: PostgreSQL; llm: клиенты шлюза (Platform API); llm-egress: API провайдеров.
    networks: [data, llm, llm-egress]
    mem_limit: 1536m
    healthcheck:
      # В образе нет curl; /health/liveliness без аутентификации.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  # PDP Platform API (ADR-0009): политики policies/cerbos ядра, только чтение; доступ только из
  # сети policy. Образ запускается от root, поэтому пользователь задан явно.
  cerbos:
    <<: *hardening
    image: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
    user: "65534:65534"
    command: ["server", "--config=/antec/config.yaml"]
    environment:
      # Хэш конфигурации и политик (scripts/lib.sh): изменение пересоздаёт контейнер.
      ANTEC_CONFIG_SHA: ${ANTEC_CERBOS_CONFIG_SHA:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=65534,gid=65534
    volumes:
      - ./cerbos/config.yaml:/antec/config.yaml:ro
      - ../../policies/cerbos:/policies:ro
    networks: [policy]
    mem_limit: 256m
    healthcheck:
      # Адрес и TLS берутся из конфигурации (--host-port несовместим с CERBOS_CONFIG образа).
      test: ["CMD", "/cerbos", "healthcheck", "--config=/antec/config.yaml", "--kind=http"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Миграции БД platform ролью владельца схемы (ADR-0006, п. 9); одноразовый, запускается
  # только из scripts/up.sh (`compose run --rm platform-migrate`).
  platform-migrate:
    profiles: [bootstrap]
    build:
      context: ../../services/platform-api
    image: localhost/antec/platform-api:0.1.0
    pull_policy: build
    command: ["migrate"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    environment:
      PLATFORM_DATABASE_USER: platform
      PLATFORM_APP_ROLE: platform_app
    volumes:
      - platform-migrate-secrets:/run/antec-secrets:ro
    networks: [data]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  # Platform API (ADR-0006): OpenAI-совместимый фасад, пользователи, история, аудит.
  # Порт на хост не публикуется: клиенты (Open WebUI) ходят по сети platform.
  platform-api:
    <<: *hardening
    build:
      context: ../../services/platform-api
    image: localhost/antec/platform-api:0.1.0
    pull_policy: build
    environment:
      PLATFORM_DATABASE_USER: platform_app
      # iss в токенах = публичный адрес Keycloak (hostname), JWKS по внутреннему адресу.
      PLATFORM_OIDC_ISSUER: http://localhost:8080/realms/antec
      PLATFORM_OIDC_JWKS_URL: http://keycloak:8080/realms/antec/protocol/openid-connect/certs
      PLATFORM_OIDC_AUDIENCE: platform-api
      # antec-smoke: только стенд (scripts/platform-smoke.sh); в инсталляциях только open-webui.
      PLATFORM_ALLOWED_CLIENTS: open-webui,antec-smoke
      PLATFORM_GATEWAY_URL: http://litellm:4000/v1
      PLATFORM_MODELS: chat-default,chat-fast
      PLATFORM_POLICY_URL: http://cerbos:3592
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65534,gid=65534
    volumes:
      - platform-api-secrets:/run/antec-secrets:ro
    # data: PostgreSQL и JWKS Keycloak; llm: LiteLLM; platform: клиенты фасада; policy: Cerbos.
    networks: [data, llm, platform, policy]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy
      cerbos:
        condition: service_healthy

  # Веб-чат (ADR-0002): единственное подключение = фасад Platform API с токеном пользователя
  # из Keycloak (auth_type system_oauth, ADR-0006, п. 3).
  open-webui:
    <<: *hardening
    image: ghcr.io/open-webui/open-webui:v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
    user: "65534:65534"
    working_dir: /app/backend
    entrypoint: ["/bin/sh", "/antec/env-from-files.sh"]
    command: ["bash", "start.sh"]
    environment:
      HOME: /tmp
      # Хэш обёртки common/env-from-files.sh (scripts/lib.sh): изменение пересоздаёт контейнер.
      ANTEC_CONFIG_SHA: ${ANTEC_OPEN_WEBUI_CONFIG_SHA:-}
      WEBUI_URL: http://localhost:3000
      CORS_ALLOW_ORIGIN: http://localhost:3000
      WEBUI_NAME: antec.ai
      # БД: всё, кроме пароля (DATABASE_PASSWORD из OpenBao через env-from-files.sh).
      DATABASE_TYPE: postgresql
      DATABASE_USER: openwebui
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: openwebui
      DATABASE_POOL_SIZE: "10"
      # Конфигурация только из окружения, не из БД: правки в админке не переживают перезапуск.
      ENABLE_PERSISTENT_CONFIG: "False"
      # Вход только через Keycloak (ADR-0002, п. 2).
      ENABLE_LOGIN_FORM: "False"
      ENABLE_PASSWORD_AUTH: "False"
      ENABLE_SIGNUP: "False"
      ENABLE_OAUTH_SIGNUP: "True"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "False"
      OAUTH_PROVIDER_NAME: antec.ai
      OAUTH_CLIENT_ID: open-webui
      # Discovery по внутреннему адресу: authorization_endpoint и issuer остаются
      # http://localhost:8080 (hostname Keycloak), token и jwks идут по сети ui.
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/antec/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:3000/oauth/oidc/callback
      OAUTH_SCOPES: openid email profile
      OAUTH_CODE_CHALLENGE_METHOD: S256
      DEFAULT_USER_ROLE: user
      # Аккаунт по стабильному antec_uid (Entra: oid, локальные: логин), а не по sub: sub
      # меняется при пересоздании realm.
      OAUTH_SUB_CLAIM: antec_uid
      # Роль в Open WebUI из ролей клиента open-webui в Keycloak (claim roles) при каждом входе.
      # Open WebUI всё равно делает администратором единственного пользователя; со вторым
      # пользователем права пересчитываются при входе, поэтому сессия короткая.
      ENABLE_OAUTH_ROLE_MANAGEMENT: "True"
      OAUTH_ROLES_CLAIM: roles
      OAUTH_ALLOWED_ROLES: user,admin
      OAUTH_ADMIN_ROLES: admin
      JWT_EXPIRES_IN: 8h
      # Администратор не читает чаты пользователей.
      ENABLE_ADMIN_CHAT_ACCESS: "False"
      WEBUI_SESSION_COOKIE_SECURE: "False"
      # Единственное подключение: фасад Platform API. Вместо ключа в Authorization идёт access
      # token пользователя из OAuth-сессии Keycloak (обновляется refresh-токеном).
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: http://platform-api:8000/v1
      OPENAI_API_KEYS: ""
      OPENAI_API_CONFIGS: '{"0": {"auth_type": "system_oauth"}}'
      ENABLE_DIRECT_CONNECTIONS: "False"
      # Доступ к моделям решает Platform API (список /v1/models для пользователя, позже Cerbos,
      # ADR-0009), а не права моделей в БД Open WebUI: без этого роль user не видит ни одной модели.
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      # Ради X-OpenWebUI-Chat-Id (разговор в истории Platform API). Заголовки X-OpenWebUI-User-*
      # идут вместе с ним, но Platform API их игнорирует: пользователь берётся из токена.
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      # Ничего не исполняется на сервере UI (ADR-0002, п. 4).
      ENABLE_PLUGINS: "False"
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_USER_WEBHOOKS: "False"
      # RAG делает Platform API (ADR-0002, п. 3); загрузка файлов и база знаний выключены.
      BYPASS_EMBEDDING_AND_RETRIEVAL: "True"
      # Без локальных моделей эмбеддингов: иначе при старте попытка загрузки из интернета.
      RAG_EMBEDDING_MODEL: ""
      AUXILIARY_EMBEDDING_MODEL: ""
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "False"
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_IMAGE_GENERATION: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_MEMORIES: "False"
      ENABLE_API_KEYS: "False"
      ENABLE_ADMIN_EXPORT: "False"
      # Служебные генерации на дешёвой модели; лишние выключены.
      TASK_MODEL_EXTERNAL: chat-fast
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      # Без обращений в интернет.
      OFFLINE_MODE: "True"
      ENABLE_VERSION_UPDATE_CHECK: "False"
    read_only: true
    tmpfs:
      # Данные UI не хранятся в контейнере: история и настройки в PostgreSQL, загрузки выключены.
      - /app/backend/data:size=512m,uid=65534,gid=65534,mode=0700
      - /tmp:size=256m,uid=65534,gid=65534
    volumes:
      - ./common/env-from-files.sh:/antec/env-from-files.sh:ro
      - open-webui-secrets:/run/antec-secrets:ro
    # data: PostgreSQL; platform: Platform API; ui: Keycloak и публикация порта на 127.0.0.1 хоста.
    networks: [data, platform, ui]
    ports:
      - "127.0.0.1:3000:8080"
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

networks:
  # Без выхода наружу и без публикации портов на хост.
  secrets:
    internal: true
  data:
    internal: true
  # Выход наружу и публикация порта на 127.0.0.1 хоста: только Keycloak
  # (браузер пользователя и login.microsoftonline.com).
  egress: {}
  # Клиенты LLM-шлюза; без выхода наружу.
  llm:
    internal: true
  # Клиенты фасада Platform API (Open WebUI); без выхода наружу.
  platform:
    internal: true
  # Platform API -> Cerbos; без выхода наружу (ADR-0009).
  policy:
    internal: true
  # Выход LiteLLM к API провайдеров. Ограничение по доменам: открытый вопрос ADR-0018.
  llm-egress: {}
  # Браузер пользователя -> Open WebUI (порт на 127.0.0.1) и Open WebUI -> Keycloak.
  # Сеть не internal: Docker публикует порт только из такой сети.
  ui: {}

volumes:
  openbao-data:
  postgres-data:
  postgres-secrets:
  keycloak-secrets:
  litellm-secrets:
  open-webui-secrets:
  platform-api-secrets:
  platform-migrate-secrets:
