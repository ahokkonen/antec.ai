# Dev-инсталляция ядра (ADR-0008, п. 7): локальный стенд deploy/compose и CI.
schema_version: 2
instance:
  id: dev
  name: "antec.ai dev"
core:
  version: "0.1.0"

models:
  - name: chat-default
    description: "Модель по умолчанию: Claude Opus 5.5"
    litellm:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - name: chat-fast
    description: "Быстрая и дешёвая модель: Claude Haiku 5.5"
    litellm:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Модель инсталляции: политика ядра её не разрешает, разрешает политика scope dev
  # (policies/model.yaml). Проверяется scripts/platform-smoke.sh.
  - name: chat-lab
    description: "Модель dev-инсталляции: Claude Haiku 5.5"
    litellm:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

# Тестовый MCP-сервер dev-инсталляции (plugins/mcp-demo, ADR-0010, п. 6): read-only инструмент
# и инструмент с подтверждением человеком.
mcp_servers:
  - name: mcp-demo
    url: http://mcp-demo:8080/mcp
    audience: mcp-demo
    protocol_version: "2026-07-28"
    tools:
      - {name: get_time, read_only: true}
      - {name: create_note}

# Агенты (ADR-0010): видны в /v1/models рядом с моделями, имя начинается с agent-.
agents:
  - name: agent-assistant
    description: "Ассистент dev-инсталляции без инструментов"
    model: chat-fast
    instructions_file: agents/assistant.md
    max_steps: 5
  - name: agent-notes
    description: "Заметки dev-инсталляции: время и создание заметки (с подтверждением)"
    model: chat-fast
    instructions_file: agents/notes.md
    tools: [mcp-demo.get_time, mcp-demo.create_note]
    max_steps: 6
    max_tool_calls: 4

settings:
  # antec-smoke: только стенд (scripts/platform-smoke.sh).
  allowed_clients: [open-webui, antec-smoke]
