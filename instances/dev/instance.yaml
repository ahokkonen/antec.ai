# Dev-инсталляция ядра (ADR-0008, п. 7): локальный стенд deploy/compose и CI.
schema_version: 6
instance:
  id: dev
  name: "antec.ai dev"
core:
  version: "0.1.0"

models:
  - name: chat-default
    description: "Модель по умолчанию: Claude Opus 5.5"
    litellm:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    # Условия договора стенда с провайдером (ADR-0015): ZDR не заключён.
    provider_terms: {zdr: false, region: us}
  - name: chat-fast
    description: "Быстрая и дешёвая модель: Claude Haiku 5.5"
    litellm:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    # Условия договора стенда с провайдером (ADR-0015): ZDR не заключён.
    provider_terms: {zdr: false, region: us}
  # Модель инсталляции: политика ядра её не разрешает, разрешает политика scope dev
  # (policies/model.yaml). Проверяется scripts/platform-smoke.sh.
  - name: chat-lab
    description: "Модель dev-инсталляции: Claude Haiku 5.5"
    # Допуск ниже, чем у остальных: проверка классов данных (ADR-0011) на стенде.
    max_data_class: internal
    litellm:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    # Условия договора стенда с провайдером (ADR-0015): ZDR не заключён.
    provider_terms: {zdr: false, region: us}

# Тестовый MCP-сервер dev-инсталляции (plugins/mcp-demo, ADR-0010, п. 6): read-only инструмент
# и инструмент с подтверждением человеком.
mcp_servers:
  - name: mcp-demo
    url: http://mcp-demo:8080/mcp
    audience: mcp-demo
    protocol_version: "2026-07-28"
    tools:
      - {name: get_time, read_only: true, data_class: public}
      # Заметки = confidential: агенту на chat-lab (допуск internal) недоступны.
      - {name: create_note, data_class: confidential}

# Агенты (ADR-0010): видны в /v1/models рядом с моделями, имя начинается с agent-.
agents:
  - name: agent-assistant
    description: "Ассистент dev-инсталляции без инструментов"
    model: chat-fast
    instructions_file: agents/assistant.md
    max_steps: 5
  - name: agent-notes
    description: "Заметки dev-инсталляции: время и создание заметки (с подтверждением)"
    model: chat-fast
    instructions_file: agents/notes.md
    tools: [mcp-demo.get_time, mcp-demo.create_note]
    max_steps: 6
    max_tool_calls: 4
  # Агент на модели с допуском internal: create_note (confidential) отклоняется до вызова
  # (ADR-0011, п. 3). Проверяется scripts/platform-smoke.sh.
  - name: agent-lab
    description: "Проверка классов данных: заметки выше допуска модели"
    model: chat-lab
    instructions_file: agents/notes.md
    tools: [mcp-demo.create_note]
    max_steps: 4
    max_tool_calls: 2

# Классы данных (ADR-0011): класс ввода пользователя.
data:
  default_class: internal

# Сроки хранения, дни (ADR-0012): тексты 30-180, метаданные и аудит 180-730.
retention:
  content_days: 90
  metadata_days: 365
  audit_days: 365
  telemetry_days: 30

# Наблюдаемость (ADR-0013): OTel Collector, VictoriaMetrics/Logs/Traces, Grafana и алерты.
observability:
  enabled: true
  # Алерты стенда только в Grafana; адрес задаётся здесь, SMTP: scripts/set-smtp.sh.
  # alert_email: "ops@example.invalid"

# Комплаенс (ADR-0015): стенд разработки, реальных данных нет.
compliance:
  operator_role: controller
  controller: {name: "antec.ai dev", contact: "dev@antec.invalid"}
  privacy_notice_url: https://antec.invalid/privacy

settings:
  # antec-smoke: только стенд (scripts/platform-smoke.sh).
  allowed_clients: [open-webui, antec-smoke]
