[project]
name = "mcp-demo"
version = "0.1.0"
description = "Тестовый MCP-сервер dev-инсталляции antec.ai (MCP 2026-07-28, ADR-0010)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Те же версии, что у Platform API: новых зависимостей нет.
dependencies = [
    "fastapi>=0.163.0,<0.164",
    "httpx>=0.28.1,<0.29",
    "pyjwt[crypto]>=2.15.1,<3",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
mcp-demo = "mcp_demo.app:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Карантин 7 дней (ADR-0004) для всех зависимостей, включая транзитивные.
exclude-newer = "2026-11-15T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "ANN", "PTH", "C4", "PT", "RET",
    "ASYNC",
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
